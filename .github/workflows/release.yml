name: Publish Release Images

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm, arm64, ppc64le]
        fakever: [blue, green, purple]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase registry owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        run: |
          make push \
            ARCH=${{ matrix.arch }} \
            FAKEVER=${{ matrix.fakever }} \
            REGISTRY=${{ env.REGISTRY }}/${{ steps.owner.outputs.name }} \
            VERSION_BASE=${{ github.ref_name }}
